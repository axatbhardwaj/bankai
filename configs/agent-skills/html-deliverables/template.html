<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- concise page title --></title>
<script type="application/json" id="html-deliverable-meta">
{
  "schema": "html.artifact.explainer.v1",
  "artifact_type": "explainer",
  "title": "<!-- full title -->",
  "date": "<!-- YYYY-MM-DD -->",
  "basis": "<!-- what ground truth this reflects: version, commit, source -->"
}
</script>
<style>
  :root{
    color-scheme: dark;
    --ground:#0b0f14; --panel:#121821; --panel2:#182130; --line:#26303e;
    --ink:#dce4ee; --dim:#8a97a8; --faint:#5c6774;
    --primary:#34d399; --secondary:#a78bfa; --team:#5ca9ff; --human:#e0a63d; --seal:#46c26a; --stop:#ff6a5e;
    --mono:"JetBrains Mono","Cascadia Code",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.65 var(--sans)}
  a{color:var(--primary)}
  main{max-width:1120px;margin:0 auto;padding:0 2.2rem 6rem}
  section{margin-top:4.2rem;scroll-margin-top:4rem}
  .eyebrow{font:600 .72rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 .9rem}
  h1{font:800 clamp(2.2rem,6vw,3.6rem)/1.08 var(--sans);letter-spacing:-.03em;margin:.4rem 0;text-wrap:balance}
  h2{font:700 1.6rem/1.25 var(--sans);letter-spacing:-.01em;margin:.1rem 0 .9rem;text-wrap:balance}
  h3{font:650 1.05rem/1.3 var(--sans);margin:1.4rem 0 .4rem}
  p{max-width:68ch}
  .thesis{font-size:1.18rem;color:var(--dim);max-width:56ch}
  code,.st{font-family:var(--mono);font-size:.85em;background:var(--panel2);border:1px solid var(--line);padding:.08em .4em;border-radius:5px;overflow-wrap:anywhere}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;overflow-x:auto;font:.82rem/1.6 var(--mono)}
  pre code{background:none;border:none;padding:0}
  figure{margin:1.6rem 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.2rem;overflow-x:auto}
  figcaption{font:.78rem/1.5 var(--mono);color:var(--dim);margin-top:.7rem;text-align:center}
  svg{display:block;min-width:720px}
  svg text{font-family:var(--mono)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1rem;margin:1.2rem 0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem}
  .card h4{margin:0 0 .45rem;font:650 1rem/1.3 var(--sans)}
  .card p{font-size:.9rem;color:var(--dim);margin:.3rem 0}
  .status{margin:1.7rem 0 0;padding:1.1rem 1.25rem;border:1px solid var(--human);border-left-width:5px;border-radius:12px;background:rgba(224,166,61,.08);max-width:760px}
  .status strong{display:block;color:var(--human);font:700 .78rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem}
  .status p{margin:.15rem 0;max-width:none}
  .next{font-size:1.02rem}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin:1.2rem 0}
  .summary-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.1rem 1.25rem}
  .summary-item h3{margin:0 0 .45rem}
  .summary-item p{font-size:.92rem;color:var(--dim);margin:.3rem 0}
  details{max-width:100%;margin:1rem 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.85rem 1rem}
  summary{cursor:pointer;font-weight:650;color:var(--ink)}
  details[open] summary{margin-bottom:.8rem}
  .strip{display:flex;flex-wrap:wrap;gap:.55rem;margin:1.1rem 0 0}
  .chip{font:600 .72rem/1 var(--mono);letter-spacing:.06em;padding:.5em .8em;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim)}
  .lane{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:1.1rem 1.25rem;margin:.9rem 0}
  .lane h4{margin:0;font:650 1rem var(--sans);display:flex;gap:.7rem;align-items:center}
  .lane .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  .lane p{font-size:.9rem;color:var(--dim)}
  .lane .route{font:.78rem/2 var(--mono);color:var(--ink);overflow-x:auto;white-space:nowrap;padding-bottom:.2rem}
  .k-primary{color:var(--primary)} .k-secondary{color:var(--secondary)} .k-team{color:var(--team)} .k-human{color:var(--human)} .k-seal{color:var(--seal)}
  table{border-collapse:collapse;width:100%;margin:1rem 0;font-size:.86rem}
  th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top}
  th{background:var(--panel2);font:600 .72rem/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  tr:nth-child(even) td{background:var(--panel)}
  nav{position:sticky;top:0;background:rgba(11,15,20,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:.5rem 2.2rem;font:.8rem var(--mono);z-index:9;display:flex;flex-wrap:wrap;gap:.4rem 1.05rem}
  nav a{color:var(--dim);text-decoration:none;white-space:nowrap} nav a:hover{color:var(--primary)}
  header{padding:4.5rem 2.2rem 0;max-width:1120px;margin:0 auto}
  .foot{margin:5rem auto 0;max-width:1120px;border-top:1px solid var(--line);padding:1.2rem 2.2rem;font:.75rem var(--mono);color:var(--dim);overflow-wrap:anywhere}
  @media (max-width:760px){.summary-grid{grid-template-columns:1fr}}
  @media (max-width:640px){main,header,nav{padding-left:1rem;padding-right:1rem}.foot{padding-left:1rem;padding-right:1rem}.status{padding:1rem}table{display:block;overflow-x:auto}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<!-- Optional sticky nav for pages longer than about three screens:
<nav><a href="#summary">Answer first</a><a href="#scope">Scope</a><a href="#evidence">Evidence</a><a href="#plan">Plan</a></nav> -->
<header>
  <p class="eyebrow"><!-- subject line, lowercase mono --></p>
  <h1><!-- REQUIRED: direct conclusion in plain language --></h1>
  <p class="thesis"><!-- REQUIRED: why this conclusion matters to the reader --></p>
  <aside class="status" aria-label="Current status">
    <strong><!-- REQUIRED: current status in a few words --></strong>
    <p data-status-answer><!-- REQUIRED: what is true right now --></p>
    <p class="next"><b>Next:</b> <span data-next-answer><!-- REQUIRED: next action and its owner --></span></p>
  </aside>
  <!-- Optional: add a .strip of short .chip facts only when they aid scanning. -->
</header>
<main>
<section id="summary" data-reader-summary>
  <!-- Decision documents: set artifact_type to decision, add data-decision-front
       to this section, replace repeated summary cards with a data-options table
       whose data-option rows precede one data-recommendation and one
       data-decision-ask. Keep the complete layer within 400 visible words. -->
  <p class="eyebrow">30-second summary</p>
  <h2><!-- REQUIRED: the one sentence answer --></h2>
  <div class="summary-grid">
    <article class="summary-item" data-summary="outcome">
      <h3><!-- REQUIRED: What changed? / What did we learn? --></h3>
      <p data-summary-answer><!-- REQUIRED: the outcome, without setup or protocol jargon --></p>
    </article>
    <article class="summary-item" data-summary="meaning">
      <h3><!-- REQUIRED: Why does it matter? --></h3>
      <p data-summary-answer><!-- REQUIRED: the consequence for the human reader --></p>
    </article>
    <article class="summary-item" data-summary="next">
      <h3><!-- REQUIRED: What happens next? --></h3>
      <p data-summary-answer><!-- REQUIRED: the next action, decision, or owner --></p>
    </article>
  </div>
</section>

<section id="scope">
  <p class="eyebrow">canonical scope</p>
  <h2><!-- REQUIRED: what this work does and does not cover --></h2>
  <p><!-- REQUIRED: canonical objective and deliverables in reader language --></p>
</section>

<section id="evidence">
  <p class="eyebrow">reasoning and evidence</p>
  <h2><!-- REQUIRED: the conclusion supported by the evidence --></h2>
  <p><!-- REQUIRED: interpret the evidence before showing its structure --></p>
  <!-- Optional: keep this figure only when it clarifies a material relationship. -->
  <figure>
  <svg viewBox="0 0 1040 160" width="100%" role="img" aria-label="<!-- REQUIRED: concise description of the diagram -->">
    <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a97a8"/></marker></defs>
    <!-- node: fill = owning actor token; gate: --seal-stroked rect; loop/optional: dashed -->
    <rect x="20" y="50" width="150" height="52" rx="9" fill="#182130" stroke="#26303e"/>
    <text x="95" y="74" fill="#dce4ee" font-size="11.5" text-anchor="middle"><!-- REQUIRED: step or state label --></text>
    <text x="95" y="92" fill="#8a97a8" font-size="9.5" text-anchor="middle"><!-- REQUIRED: plain-language annotation --></text>
    <line x1="170" y1="76" x2="230" y2="76" stroke="#8a97a8" stroke-width="1.2" marker-end="url(#ar)"/>
    <!-- comparative routes use one transit map: stage columns, one line per route,
         station circles only where each route stops -->
  </svg>
  <figcaption><!-- REQUIRED: the one insight the drawing cannot say --></figcaption>
  </figure>
  <details class="technical">
    <summary><!-- REQUIRED: specific label for the audit detail --></summary>
    <p><!-- REQUIRED: complete manifest, exact sources, hashes, commands, or matrix --></p>
  </details>
</section>

<section id="decisions">
  <p class="eyebrow">findings and decisions</p>
  <h2><!-- REQUIRED: the most important finding or decision --></h2>
  <p><!-- REQUIRED: findings, decisions, and their practical effect --></p>
</section>

<section id="plan">
  <p class="eyebrow">current plan and todo</p>
  <h2><!-- REQUIRED: current plan state --></h2>
  <p><!-- REQUIRED: completed, active, and remaining work with clear owners --></p>
</section>
</main>
<p class="foot"><!-- WHAT · as of VERSION/COMMIT · DATE --></p>
</body>
</html>
